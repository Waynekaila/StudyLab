name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Qt 6.8 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtpdf'
          cache: true
      - name: Environnement MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configuration
        run: cmake --preset windows-msvc-release
      - name: Compilation
        run: cmake --build --preset windows-msvc-release
      - name: Tests
        run: ctest --preset windows-msvc-release
      - name: Détail des tests en échec
        if: failure()
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          Get-ChildItem build/windows-msvc-release/tests -Filter "tst_*.exe" | ForEach-Object {
            & $_.FullName -o "$($_.BaseName).txt,txt" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::group::$($_.BaseName) (code $LASTEXITCODE)"
              Get-Content "$($_.BaseName).txt" -ErrorAction SilentlyContinue
              Write-Host "::endgroup::"
            }
          }
