name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Qt 6.8 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Environnement MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configuration
        run: cmake --preset windows-msvc-release
      - name: Compilation
        run: cmake --build --preset windows-msvc-release
      - name: Tests
        run: ctest --preset windows-msvc-release
