name: Publication

# Construit et teste les paquets d'une version étiquetée (vX.Y.Z), puis les joint à la version GitHub.
# Les notes de version sont la section correspondante de CHANGELOG.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Étiquette à publier (ex. v0.1.0)
        required: true
        type: string
      commit:
        description: Commit à étiqueter si l'étiquette n'existe pas encore (SHA complet ou abrégé)
        required: false
        type: string

permissions:
  contents: write

jobs:
  tag:
    # Lancé à la main : crée l'étiquette annotée sur le commit indiqué si elle n'existe pas encore.
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - name: Étiquette
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG existe déjà"
            exit 0
          fi
          test -n "$COMMIT" || { echo "$TAG n'existe pas : indiquer le commit à étiqueter"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT" --jq .sha)
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$TAG" -f message="StudyLab ${TAG#v}" \
                -f object="$sha" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$obj" > /dev/null
          echo "$TAG → $sha"

  debian:
    needs: tag
    uses: ./.github/workflows/build-debian.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  windows:
    needs: tag
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: [debian, windows]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes de version (CHANGELOG.md)
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; title = substr($0, 4); next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "Section $version absente de CHANGELOG.md"; exit 1; }
          title=$(grep -m1 "^## $version " CHANGELOG.md | sed 's/^## //')
          echo "TITLE=StudyLab $title" >> "$GITHUB_ENV"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist
      - name: Version GitHub
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TITLE" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          fi
